spring:
  jwt:
    secret: ${PETLY_TEST_SECRET}
  auth:
    block-duration-minutes: 1
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;INIT=CREATE SCHEMA IF NOT EXISTS database_petly\;SET SCHEMA database_petly
    driver-class-name: org.h2.Driver
    username: sa
    password:

  sql:
    init:
      mode: always
      schema-locations: classpath:sql/test-schema.sql

  mail:
    host: localhost
    port: 1025
    username:
    password:
    properties:
      mail:
        smtp:
          auth: false

  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: database_petly
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

interno:
  api-secret: test-internal-secret

petly:
  web-reset-link-base: http://localhost:5173/recuperacion
  reset-link-base: petly://recuperacion
  media-base-url: http://localhost:8000/media/