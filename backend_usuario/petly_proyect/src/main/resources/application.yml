spring:
  application:
    # Se conserva el nombre original del proyecto.
    name: petly_proyect

  datasource:
    # Base compartida `database_petly` en XAMPP (MariaDB 10.4.32, puerto 3306).
    # Sobrescribir por variables de entorno en Windows; ver .env.example.
    url: ${DB_URL:jdbc:mariadb://127.0.0.1:3306/database_petly?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima&characterEncoding=utf8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

  jpa:
    # Hibernate no crea ni actualiza tablas (PLANNING v2 §6): las migraciones
    # de Spring Boot se aplican con Flyway desde db/migration/.
    # El dialecto (MariaDB) lo detecta Hibernate desde el driver.
    hibernate:
      ddl-auto: none
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  # Redis para rate limiting y bloqueo de intentos fallidos (US-21)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms

  jwt:
    secret: ${SPRING_JWT_SECRET:change-me-shared-secret-for-jwt-validation-min-32-chars}
    access-token-minutes: 60
    refresh-token-days: 7
    issuer: petly-spring
    audience: petly-django

  auth:
    max-attempts: 2
    block-duration-minutes: 5

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_PROPERTIES_MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:true}
    from: ${MAIL_FROM:noreply@petly.local}


server:
  port: 8080

# SpringDoc OpenAPI 3
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    use-root-path: true
  packages-to-scan: com.petly

# JWT Configuration (US-21)
# Auth configuration (US-21)
# Email configuration (US-24)
# Django API URL para comunicación interna (US-18)
django:
  api:
    url: ${DJANGO_API_URL:http://localhost:8000}
