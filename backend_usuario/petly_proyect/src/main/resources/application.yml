spring:
  application:
    # Se conserva el nombre original del proyecto.
    name: petly_proyect

  datasource:
    # Base compartida `database_petly` en XAMPP (MariaDB 10.4.32, puerto 3306).
    # Sobrescribir por variables de entorno en Windows; ver .env.example.
    url: ${DB_URL:jdbc:mariadb://127.0.0.1:3306/database_petly?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima&characterEncoding=utf8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

  jpa:
    # Hibernate no crea ni actualiza tablas (PLANNING v2 §6): las migraciones
    # de Spring Boot se aplican con Flyway desde db/migration/.
    # El dialecto (MariaDB) lo detecta Hibernate desde el driver.
    hibernate:
      ddl-auto: none
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jwt:
    secret: ${SPRING_JWT_SECRET}
    access-token-minutes: 60
    issuer: petly-spring
    audience: petly-django

  auth:
    max-attempts: 2
    block-duration-minutes: 1

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_PROPERTIES_MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:false}
    from: ${MAIL_FROM:noreply@petly.local}


server:
  port: 8080

# SpringDoc OpenAPI 3
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    use-root-path: true
  packages-to-scan: com.petly

petly:
  django-api-base-url: ${DJANGO_API_BASE_URL:http://localhost:8000}
  web-reset-link-base: ${WEB_RESET_LINK_BASE:http://localhost:5173/recuperacion}
  reset-link-base: ${RESET_LINK_BASE:petly://recuperacion}
  media-base-url: ${MEDIA_BASE_URL:http://10.0.2.2:8000/media/}
