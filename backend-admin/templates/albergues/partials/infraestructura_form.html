<!-- Formulario nueva/editar infraestructura -->
<div class="card mt-3" id="infra-form">
    <div class="card-header d-flex justify-content-between align-items-center">
        <h5 class="mb-0">
            {% if infra %}<i class="bi bi-pencil me-2"></i>Editar área{% else %}<i class="bi bi-plus-circle me-2"></i>Nueva área{% endif %}
        </h5>
        <button class="btn btn-sm btn-outline-secondary" hx-get="{% url 'albergue_infraestructura' %}#infra-form" hx-target="#infra-form" hx-swap="outerHTML">
            <i class="bi bi-x me-1"></i>Cancelar
        </button>
    </div>
    <div class="card-body">
        <form hx-post="{% url 'albergue_infraestructura' %}" hx-target="#infra-rows" hx-swap="beforeend" class="row g-3">
            {% csrf_token %}
            {% if infra %}<input type="hidden" name="infra_id" value="{{ infra.id }}">{% endif %}
            
            <div class="col-md-4">
                <label class="form-label">Tipo *</label>
                <select name="tipo" class="form-select" required>
                    <option value="">Seleccionar...</option>
                    {% for value, label in tipos %}
                        <option value="{{ value }}" {% if infra and infra.tipo == value %}selected{% endif %}>{{ label }}</option>
                    {% endfor %}
                </select>
            </div>
            
            <div class="col-md-4">
                <label class="form-label">Nombre *</label>
                <input type="text" name="nombre" class="form-control" value="{{ infra.nombre|default:'' }}" required placeholder="Ej: Sala de cirugía, Canil A, etc.">
            </div>
            
            <div class="col-md-4">
                <label class="form-label">Metros cuadrados</label>
                <input type="number" name="metros_cuadrados" class="form-control" value="{{ infra.metros_cuadrados|default:'' }}" step="0.01" min="0" placeholder="Ej: 25.50">
            </div>
            
            <div class="col-md-4">
                <label class="form-label">Capacidad (animales)</label>
                <input type="number" name="capacidad" class="form-control" value="{{ infra.capacidad|default:'' }}" min="0" placeholder="Ej: 10">
            </div>
            
            <div class="col-12">
                <label class="form-label">Descripción</label>
                <textarea name="descripcion" class="form-control" rows="2" placeholder="Detalles de la área...">{{ infra.descripcion|default:'' }}</textarea>
            </div>
            
            <div class="col-12">
                <label class="form-label">Equipamiento / Observaciones</label>
                <textarea name="equipamiento" class="form-control" rows="2" placeholder="Ej: Mesa de cirugía, lámpara escialítica, anestesia...">{{ infra.equipamiento|default:'' }}</textarea>
            </div>
            
            <div class="col-12">
                <div class="form-check">
                    <input type="checkbox" name="activo" class="form-check-input" id="activo" {% if not infra or infra.activo %}checked{% endif %}>
                    <label class="form-check-label" for="activo">Área activa</label>
                </div>
            </div>
            
            <div class="col-12 d-flex justify-content-end gap-2">
                <button type="button" class="btn btn-outline-secondary" hx-get="{% url 'albergue_infraestructura' %}#infra-form" hx-target="#infra-form" hx-swap="outerHTML">
                    <i class="bi bi-x me-1"></i>Cancelar
                </button>
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-save me-1"></i>{% if infra %}Actualizar{% else %}Crear{% endif %}
                </button>
            </div>
        </form>
    </div>
</div>
