<!-- Formulario de edición (HTMX) -->
<div class="card" id="perfil-form">
    <div class="card-header d-flex justify-content-between align-items-center">
        <h5 class="mb-0"><i class="bi bi-pencil me-2"></i>Editar Información</h5>
        <button class="btn btn-sm btn-outline-secondary" hx-get="{% url 'albergue_perfil' %}#perfil-detalle" hx-target="#perfil-detalle" hx-swap="outerHTML">
            <i class="bi bi-x me-1"></i>Cancelar
        </button>
    </div>
    <div class="card-body">
        <form hx-post="{% url 'albergue_perfil' %}" hx-target="#perfil-detalle" hx-swap="outerHTML" class="row g-3">
            {% csrf_token %}
            
            <div class="col-md-6">
                <label class="form-label">Nombre *</label>
                <input type="text" name="nombre" class="form-control" value="{{ albergue.nombre }}" required>
            </div>
            
            <div class="col-md-6">
                <label class="form-label">Teléfono</label>
                <input type="text" name="telefono" class="form-control" value="{{ albergue.telefono }}">
            </div>
            
            <div class="col-md-6">
                <label class="form-label">Email *</label>
                <input type="email" name="email" class="form-control" value="{{ albergue.email }}">
            </div>
            
            <div class="col-md-6">
                <label class="form-label">Sitio web</label>
                <input type="url" name="sitio_web" class="form-control" value="{{ albergue.sitio_web }}">
            </div>
            
            <div class="col-12">
                <label class="form-label">Dirección *</label>
                <input type="text" name="direccion" class="form-control" value="{{ albergue.direccion }}" required>
            </div>
            
            <div class="col-12">
                <label class="form-label">Descripción</label>
                <textarea name="descripcion" class="form-control" rows="3">{{ albergue.descripcion }}</textarea>
            </div>
            
            <div class="col-md-4">
                <label class="form-label">Capacidad máxima</label>
                <input type="number" name="capacidad_maxima" class="form-control" value="{{ albergue.capacidad_maxima }}" min="0">
            </div>
            
            <div class="col-md-4">
                <label class="form-label">Horario de atención</label>
                <input type="text" name="horario_atencion" class="form-control" value="{{ albergue.horario_atencion }}" placeholder="Ej: Lun-Vie 9:00-18:00, Sáb 9:00-13:00">
            </div>
            
            <div class="col-md-4">
                <label class="form-label">&nbsp;</label>
                <div class="form-check mt-4">
                    <input type="hidden" name="activo" value="0">
                    <input type="checkbox" name="activo" class="form-check-input" id="activo" {% if albergue.activo %}checked{% endif %} value="1">
                    <label class="form-check-label" for="activo">Albergue activo</label>
                </div>
            </div>
            
            <hr>
            
            <h6 class="mb-3"><i class="bi bi-person-badge me-2"></i>Responsable</h6>
            
            <div class="col-md-6">
                <label class="form-label">Nombre</label>
                <input type="text" name="responsable_nombre" class="form-control" value="{{ albergue.responsable_nombre }}">
            </div>
            
            <div class="col-md-6">
                <label class="form-label">Teléfono</label>
                <input type="text" name="responsable_telefono" class="form-control" value="{{ albergue.responsable_telefono }}">
            </div>
            
            <div class="col-md-6">
                <label class="form-label">Email</label>
                <input type="email" name="responsable_email" class="form-control" value="{{ albergue.responsable_email }}">
            </div>
            
            <div class="col-12 d-flex justify-content-end gap-2">
                <button type="button" class="btn btn-outline-secondary" hx-get="{% url 'albergue_perfil' %}#perfil-detalle" hx-target="#perfil-detalle" hx-swap="outerHTML">
                    <i class="bi bi-x me-1"></i>Cancelar
                </button>
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-save me-1"></i>Guardar cambios
                </button>
            </div>
        </form>
    </div>
</div>
