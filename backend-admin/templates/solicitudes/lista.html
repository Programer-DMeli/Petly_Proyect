{% extends "base.html" %}

{% block title %}Solicitudes - {{ albergue.nombre }} - Petly{% endblock %}

{% block content %}
<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
    <h1 class="h2"><i class="bi bi-file-earmark-text me-2"></i>Solicitudes de Adopción</h1>
</div>

<!-- Filtros y búsqueda -->
<div class="card mb-4">
    <div class="card-body">
        <form class="row g-3" hx-get="{% url 'solicitud_lista' %}" hx-target="#solicitud-tabla" hx-trigger="submit, change from:select" hx-push-url="true">
            {% csrf_token %}
            <div class="col-md-3">
                <label class="form-label">Buscar</label>
                <input type="text" name="q" class="form-control" value="{{ busqueda }}" placeholder="Postulante, mascota..." hx-trigger="keyup changed delay:300ms">
            </div>
            <div class="col-md-3">
                <label class="form-label">Estado</label>
                <select name="estado" class="form-select">
                    <option value="">Todos</option>
                    {% for value, label in estados %}
                        <option value="{{ value }}" {% if estado_filtro == value %}selected{% endif %}>{{ label }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label">Mascota</label>
                <select name="mascota" class="form-select">
                    <option value="">Todas</option>
                    {% for m in mascotas_filtro %}
                        <option value="{{ m.id }}" {% if mascota_filtro == m.id|stringformat:"s" %}selected{% endif %}>{{ m.nombre }} (#{{ m.codigo }})</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-3 d-flex align-items-end">
                <a href="{% url 'solicitud_lista' %}" class="btn btn-outline-secondary w-100">Limpiar</a>
            </div>
        </form>
    </div>
</div>

<!-- Tabla de solicitudes -->
<div class="card" id="solicitud-tabla">
    <div class="card-body p-0">
        {% include "solicitudes/partials/solicitud_tabla.html" %}
    </div>
</div>

<!-- Modal detalle -->
<div class="modal fade" id="modalSolicitud" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content" id="solicitud-detalle"></div>
    </div>
</div>

{% endblock %}

{% block extra_js %}
<script>
    document.body.addEventListener('htmx:afterSwap', function(evt) {
        if (evt.target.id === 'solicitud-detalle') {
            const modal = new bootstrap.Modal(document.getElementById('modalSolicitud'));
            modal.show();
        }
    });
</script>
{% endblock %}
