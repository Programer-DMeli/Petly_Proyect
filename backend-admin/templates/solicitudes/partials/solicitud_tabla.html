<!-- Tabla de solicitudes -->
<div class="table-responsive">
    <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
            <tr>
                <th>#</th>
                <th>Postulante</th>
                <th>Mascota</th>
                <th>Fecha solicitud</th>
                <th class="text-center">Estado</th>
                <th class="text-center">Revisado por</th>
                <th class="text-center">Fecha revisión</th>
                <th class="text-end">Acciones</th>
            </tr>
        </thead>
        <tbody id="solicitud-rows">
            {% for solicitud in solicitudes %}
                {% include "solicitudes/partials/solicitud_fila.html" %}
            {% empty %}
                <tr>
                    <td colspan="8" class="text-center text-muted py-5">
                        <i class="bi bi-file-earmark-text fs-1 d-block mb-2"></i>
                        <p class="mb-1">No hay solicitudes</p>
                        {% if busqueda or estado_filtro or mascota_filtro %}
                            <a href="{% url 'solicitud_lista' %}" class="btn btn-outline-primary btn-sm">Limpiar filtros</a>
                        {% endif %}
                    </td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
