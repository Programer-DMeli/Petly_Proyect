{% extends "base.html" %}

{% block title %}Postulantes - {{ albergue.nombre }} - Petly{% endblock %}

{% block content %}
<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
    <h1 class="h2"><i class="bi bi-people me-2"></i>Postulantes</h1>
</div>

<!-- Filtros y búsqueda -->
<div class="card mb-4">
    <div class="card-body">
        <form class="row g-3" hx-get="{% url 'postulante_lista' %}" hx-target="#postulante-tabla" hx-trigger="submit, change from:select" hx-push-url="true">
            {% csrf_token %}
            <div class="col-md-4">
                <label class="form-label">Buscar</label>
                <input type="text" name="q" class="form-control" value="{{ busqueda }}" placeholder="Nombre, documento, email..." hx-trigger="keyup changed delay:300ms">
            </div>
            <div class="col-md-3">
                <label class="form-label">Estado</label>
                <select name="estado" class="form-select">
                    <option value="">Todos</option>
                    {% for value, label in estados %}
                        <option value="{{ value }}" {% if estado_filtro == value %}selected{% endif %}>{{ label }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-3 d-flex align-items-end">
                <a href="{% url 'postulante_lista' %}" class="btn btn-outline-secondary w-100">Limpiar</a>
            </div>
        </form>
    </div>
</div>

<!-- Tabla de postulantes -->
<div class="card" id="postulante-tabla">
    <div class="card-body p-0">
        {% include "postulantes/partials/postulante_tabla.html" %}
    </div>
</div>

<!-- Modal detalle -->
<div class="modal fade" id="modalPostulante" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-scrollable">
        <div class="modal-content" id="postulante-detalle"></div>
    </div>
</div>

{% endblock %}

{% block extra_js %}
<script>
    document.body.addEventListener('htmx:afterSwap', function(evt) {
        if (evt.target.id === 'postulante-detalle') {
            const modal = new bootstrap.Modal(document.getElementById('modalPostulante'));
            modal.show();
        }
    });
</script>
{% endblock %}
