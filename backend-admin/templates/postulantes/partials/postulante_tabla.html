<!-- Tabla de postulantes -->
<div class="table-responsive">
    <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
            <tr>
                <th>Documento</th>
                <th>Nombre</th>
                <th>Contacto</th>
                <th class="text-center">Estado</th>
                <th class="text-center">Solicitudes</th>
                <th class="text-center">Aprobadas</th>
                <th class="text-center">Pendientes</th>
                <th class="text-end">Acciones</th>
            </tr>
        </thead>
        <tbody id="postulante-rows">
            {% for postulante in postulantes %}
                {% include "postulantes/partials/postulante_fila.html" %}
            {% empty %}
                <tr>
                    <td colspan="8" class="text-center text-muted py-5">
                        <i class="bi bi-people fs-1 d-block mb-2"></i>
                        <p class="mb-1">No hay postulantes registrados</p>
                        {% if busqueda or estado_filtro %}
                            <a href="{% url 'postulante_lista' %}" class="btn btn-outline-primary btn-sm">Limpiar filtros</a>
                        {% endif %}
                    </td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
